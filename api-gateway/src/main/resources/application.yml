server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      redis-rate-limiter:
        include-headers: true
        deny-empty-key: true
      server:
        webflux:
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL}
              predicates:
                - Path=/auth-api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
            - id: iam-login
              uri: ${IAM_SERVICE_URL}
              predicates:
                - Path=/auth-api/login
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
                    redis-rate-limiter.requestedTokens: 1
            - id: iam-register
              uri: ${IAM_SERVICE_URL}
              predicates:
                - Path=/auth-api/register
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
            - id: test-service
              uri: ${TEST_SERVICE_URL}
              predicates:
                - Path=/tests-api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
            - id: attempt-service
              uri: ${ATTEMPT_SERVICE_URL}
              predicates:
                - Path=/attempts-api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
            - id: community-service
              uri: ${COMMUNITY_SERVICE_URL}
              predicates:
                - Path=/community-api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URL}
              predicates:
                - Path=/analytics-api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userOrIpKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1

logging:
  level:
    org.springframework.cloud.gateway: INFO

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    urls:
      - name: IAM Service
        url: /auth-api/v3/api-docs
      - name: Test Service
        url: /tests-api/v3/api-docs
      - name: Attempts Service
        url: /attempts-api/v3/api-docs
      

gateway:
  security:
    public-paths:
      - /auth-api/login
      - /auth-api/register
      - /auth-api/refresh
      - /auth-api/verify-email
      - /auth-api/resend-verification

      - /auth-api/oauth2/authorization/**
      - /auth-api/login/oauth2/code/**

      - /tests-api/public/**
      - /community-api/public/**
    jwt:
      algorithm: ${JWT_SIGNING_ALGORITHM:RS256}
      secret: ${JWT_SECRET:}
      public-key: ${JWT_PUBLIC_KEY_PATH}
      cookie-name: ACCESS_TOKEN
      user-id-claim: sub
      role-claim: role
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      clock-skew-seconds: 30

app:
  api:
    version: ${API_VERSION}
