services:
  baahubali-redis:
    image: redis:7-alpine
    container_name: baahubali-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          memory: 256M
  
  baahubali-kafka:
    image: apache/kafka:latest
    container_name: baahubali-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://baahubali-kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@baahubali-kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'Mk3OEYBSD3TfxwNWRZM0A'
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          memory: 1G

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - backend-network
    depends_on:
      - baahubali-redis
    deploy:
      resources:
        limits:
          memory: 1G

  iam-service:
    build:
      context: .
      dockerfile: iam-service/Dockerfile
    container_name: iam-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: baahubali-kafka:29092
    networks:
      - backend-network
    depends_on:
      - baahubali-redis
      - baahubali-kafka
    deploy:
      resources:
        limits:
          memory: 1G

  test-service:
    build:
      context: .
      dockerfile: test-service/Dockerfile
    container_name: test-service
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: baahubali-kafka:29092
    networks:
      - backend-network
    depends_on:
      - baahubali-redis
      - baahubali-kafka
    deploy:
      resources:
        limits:
          memory: 1G

  attempt-service:
    build:
      context: .
      dockerfile: attempt-service/Dockerfile
    container_name: attempt-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: baahubali-kafka:29092
    networks:
      - backend-network
    depends_on:
      - baahubali-redis
      - baahubali-kafka
    deploy:
      resources:
        limits:
          memory: 1G
    
  community-service:
    build:
      context: .
      dockerfile: community-service/Dockerfile
    container_name: community-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: baahubali-kafka:29092
    networks:
      - backend-network
    depends_on:
      - baahubali-redis
      - baahubali-kafka
    deploy:
      resources:
        limits:
          memory: 1G

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=baahubali-local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=baahubali-kafka:29092
    networks:
      - backend-network
    depends_on:
      - baahubali-kafka

networks:
  backend-network:
    driver: bridge

volumes:
  redis_prod_data:
