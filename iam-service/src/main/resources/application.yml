server:
  servlet:
    context-path: /auth-api

spring:
  application:
    name: iam-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${IAM_SERVICE_DATABASE:iam_db}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE}
    baseline-version: 5

app:
  api:
    version: ${API_VERSION}
  email-verification:
    base-url: ${EMAIL_VERIFICATION_BASE_URL}
  jwt:
    # MUST be overridden via env var in every real environment — this default is for local dev only.
    secret: ${JWT_SECRET:}
    signing-algorithm: ${JWT_SIGNING_ALGORITHM:RS256}
    private-key: ${JWT_PRIVATE_KEY_PATH}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    expiration-ms: ${JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS}
    cookie-name: ACCESS_TOKEN
    refresh-cookie-name: REFRESH_TOKEN
    cookie-domain: ${COOKIE_DOMAIN:}
    cookie-secure: ${COOKIE_SECURE}
    cookie-same-site: ${COOKIE_SAME_SITE}

internal:
  auth:
    allowed-clients:
      community-service: ${COMMUNITY_SERVICE_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:false}
