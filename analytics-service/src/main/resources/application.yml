server:
  servlet:
    context-path: /analytics-api

spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ANALYTICS_SERVICE_DATABASE:analytics_db}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ANALYTICS_SERVICE_DATABASE:analytics_db}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    user: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

internal:
  auth:
    my-secret: ${ANALYTICS_SERVICE_SECRET:analytics-secret-key}
    allowed-clients:
      attempt-service: ${ATTEMPT_SERVICE_SECRET:attempt-secret-key}

app:
  api:
    version: ${API_VERSION:1.2.0}
