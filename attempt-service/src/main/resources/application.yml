server:
  servlet:
    context-path: /attempts-api

spring:
  application:
    name: attempt-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ATTEMPT_SERVICE_DATABASE:attempt_db}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED}
    baseline-on-migrate: false

internal:
  auth:
    my-secret: ${ATTEMPT_SERVICE_SECRET}
    allowed-clients:
      api-gateway: ${API_GATEWAY_SERVICE_SECRET}
      community-service: ${COMMUNITY_SERVICE_SECRET}
      test-service: ${TEST_SERVICE_SECRET}
  services:
    test-url: ${TEST_SERVICE_URL}

app:
  api:
    version: ${API_VERSION}