server:
  servlet:
    context-path: /attempts-api
  tomcat:
    redirect-context-root: false

spring:
  application:
    name: attempt-service

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ATTEMPT_SERVICE_DATABASE:attempt_db}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${ATTEMPT_SERVICE_DATABASE:attempt_db}?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    user: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

internal:
  auth:
    my-secret: ${ATTEMPT_SERVICE_SECRET:attempt-secret-key}
    allowed-clients:
      community-service: ${COMMUNITY_SERVICE_SECRET:community-secret-key}
  services:
    test-url: ${TEST_SERVICE_URL:http://test-service:8080/tests-api}

app:
  api:
    version: ${API_VERSION:1.2.0}
